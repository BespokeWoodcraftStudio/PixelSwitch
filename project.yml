name: PixelSwitch
options:
  bundleIdPrefix: ai.pixelventures
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  developmentLanguage: en
  knownRegions:
    - en
    - zh-Hans
    - ja
    - de
    - fr

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: false
    CODE_SIGN_STYLE: Automatic
    # No team: CI builds unsigned, then ad-hoc signs. Put your own Apple team
    # here and in the widget target to sign locally with Xcode.
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: targeted

targets:
  PixelSwitch:
    type: application
    platform: macOS
    sources:
      - path: PixelSwitch
      - path: Shared
    info:
      path: PixelSwitch/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: ai.pixelventures.pixelswitch
            CFBundleURLSchemes:
              - pixelswitch
        # Sparkle: feed URL points at the always-latest PixelSwitch release's
        # appcast asset. CI uploads `appcast.xml` to each tagged release
        # alongside the DMG, signed with the PixelSwitch EdDSA key below.
        SUFeedURL: https://github.com/BespokeWoodcraftStudio/PixelSwitch/releases/latest/download/appcast.xml
        SUEnableAutomaticChecks: true
        # Every 6 hours, so "Update automatically" picks up a release the same day.
        SUScheduledCheckInterval: 21600
        # PixelSwitch public EdDSA key. The private half lives in the founder's
        # login keychain (Sparkle generate_keys, account "pixelswitch") and in the
        # `SPARKLE_EDDSA_KEY` GitHub secret used by CI to sign each DMG.
        SUPublicEDKey: rk8t6LzU0KnCEzj6+xCXL5XC0CUSfLwtUneaNWX+5/U=
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.pixelventures.pixelswitch
        CODE_SIGN_ENTITLEMENTS: PixelSwitch/Resources/PixelSwitch.entitlements
        PRODUCT_NAME: PixelSwitch
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "23"
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    entitlements:
      path: PixelSwitch/Resources/PixelSwitch.entitlements
      properties:
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)ai.pixelventures.pixelswitch
    dependencies:
      - target: PixelSwitchWidgetExtension
        embed: true
        codeSign: true
      # The `pixelswitch` command-line tool, copied to Contents/Helpers.
      # Not linked; CI signs it (see .github/workflows/build.yml).
      - target: PixelSwitchCLI
        embed: true
        link: false
        codeSign: false
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - package: Sparkle

  PixelSwitchWidgetExtension:
    type: extensionkit-extension
    platform: macOS
    sources:
      - path: PixelSwitchWidget
      - path: Shared
    info:
      path: PixelSwitchWidget/Info.plist
      properties:
        CFBundleDisplayName: PixelSwitch Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.pixelventures.pixelswitch.widget
        CODE_SIGN_ENTITLEMENTS: PixelSwitchWidget/Resources/PixelSwitchWidget.entitlements
        PRODUCT_NAME: PixelSwitchWidgetExtension
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "23"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SWIFT_STRICT_CONCURRENCY: targeted
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        SKIP_INSTALL: true
    entitlements:
      path: PixelSwitchWidget/Resources/PixelSwitchWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)ai.pixelventures.pixelswitch

  # `pixelswitch`: remote control from the command line or an AI (MCP).
  # The target and module are PixelSwitchCLI, never `pixelswitch`: CI's disk
  # ignores case, so a name differing from the app's only by case shares its
  # build folder (scripts/check-target-names.sh guards this).
  PixelSwitchCLI:
    type: tool
    productName: pixelswitch
    platform: macOS
    sources:
      - path: PixelSwitchCLI
      - path: PixelSwitch/Control/ControlProtocol.swift
    settings:
      base:
        PRODUCT_NAME: pixelswitch
        PRODUCT_MODULE_NAME: PixelSwitchCLI
        PRODUCT_BUNDLE_IDENTIFIER: ai.pixelventures.pixelswitch.cli
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "23"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: true
